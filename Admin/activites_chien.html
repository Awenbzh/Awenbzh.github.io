<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activités chien - Breizh Plage</title>
<style>
:root{font-family:system-ui,sans-serif;color:#102a43;background:#eef7fb}*{box-sizing:border-box}body{margin:0}.top{padding:14px 22px;background:#07539a;color:#fff}.top h1{margin:0;font-size:clamp(1.35rem,3vw,2rem)}.top p{margin:4px 0 0;opacity:.85}.layout{display:grid;grid-template-columns:minmax(250px,310px) 1fr;gap:16px;padding:16px;max-width:1280px;margin:auto}.panel{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 18px #1232}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;padding:8px 11px;background:#0867bd;color:#fff;cursor:pointer}button.secondary{background:#e6f1f8;color:#123}button.danger{background:#b42318}.search{width:100%;padding:9px;border:1px solid #b8cbd7;border-radius:8px;margin:2px 0 10px}.list{display:grid;gap:8px;max-height:70vh;overflow:auto}.item{padding:10px;border:1px solid #d6e4ec;border-radius:9px;cursor:pointer}.item.active{border-color:#0867bd;background:#eef7ff}.notice{padding:9px;background:#e8f6ed;border-radius:8px;margin-bottom:12px}.section{border:1px solid #d9e6ec;border-radius:11px;padding:10px;margin-bottom:12px;background:#fbfdfe}.section h2{font-size:1rem;margin:0 0 10px;color:#07539a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:4px}.field.full{grid-column:1/-1}.field label{font-weight:700;font-size:13px}.field input,.field select,.field textarea{width:100%;border:1px solid #b8cbd7;border-radius:7px;padding:8px}.field textarea{min-height:70px;resize:vertical}.help{font-size:12px;color:#607177}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{color:#607177;text-align:center;padding:18px}@media(max-width:760px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.list{max-height:30vh}}
</style></head><body><header class="top"><h1>Balades &amp; activités avec mon chien</h1><p>Ajoutez des activités sans nouveau build Flutter.</p></header>
<main class="layout"><section class="panel"><div class="toolbar"><button id="newBtn">Nouvelle activité</button><button class="secondary" id="importBtn">Importer JSON</button><button id="exportBtn">Publier les données</button><input id="file" type="file" accept="application/json" hidden></div><input class="search" id="search" placeholder="Rechercher une activité"><div class="toolbar"><select id="department"><option value="">Tous les départements</option></select><select id="category"><option value="">Toutes les catégories</option></select><select id="status"><option value="">Tous les statuts</option></select></div><div id="list" class="list"></div></section><section class="panel"><div id="notice" class="notice">Chargement des activités…</div><form id="form"><div class="empty">Sélectionnez une activité.</div></form></section></main>
<script>
const DATA_URL='/data/activites_chien.json',VERSION_URL='/data/activites_chien_version.json',DRAFT='breizh-plage-dog-activities-draft-v1';
const CATEGORIES={balade_randonnee:'Randonnée',sentier_littoral:'Sentier littoral',foret:'Forêt',parc_espace_vert:'Parc & jardin',site_naturel:'Site naturel',patrimoine_visite:'Patrimoine',loisirs_activite:'Loisirs',autre:'Autre'};
const STATUSES={autorise:'🟢 Autorisé',autorise_sous_conditions:'🟠 Autorisé sous conditions',interdit:'🔴 Interdit',a_verifier:'⚪ À vérifier'};const LEASH={oui:'Oui',non:'Non',inconnu:'Non renseigné'};
let activities=[],version={activitiesVersion:0},selected=null;const $=id=>document.getElementById(id),text=v=>v==null?'':String(v);
const sections=[['📍 L’activité',[['name','Nom','required'],['category','Catégorie','category'],['commune','Commune','required'],['department','Département','required'],['latitude','Latitude'],['longitude','Longitude'],['description','Description courte','textarea required']]],['🐶 Avec mon chien',[['dog_status','Statut chien','status'],['leash_required','Laisse obligatoire','leash'],['conditions','Conditions','textarea'],['period','Période'],['hours','Horaires']]],['🥾 Infos pratiques',[['distance_km','Distance (km)'],['duration_minutes','Durée (minutes)'],['difficulty','Difficulté','difficulty'],['price','Tarif'],['parking','Parking'],['water_point','Point d’eau'],['accessibility','Accessibilité']]],['🌐 Voir l’activité complète',[['source_name','Source'],['source_url','Lien vers la fiche complète']]],['🖼️ Photo & suivi',[['photo_url','URL photo'],['last_verified','Date de vérification']]]];
function normalize(payload){const list=Array.isArray(payload)?payload:payload&&Array.isArray(payload.activities)?payload.activities:null;if(!list)throw Error('Format attendu : objet contenant activities');return list.map(v=>({...v,active:v.active!==false&&String(v.active).toLowerCase()!=='false'}))}
function human(map,value){return map[value]||value||'Non renseigné'}function optionMap(key){return key==='category'?CATEGORIES:key==='status'?STATUSES:key==='leash'?LEASH:{'':'Non renseigné',facile:'Facile',moyenne:'Moyenne',difficile:'Difficile'}}
function field([key,label,type]){const a=selected==null?{}:activities[selected],value=text(a[key]);if(['category','status','leash','difficulty'].includes(type)){const map=optionMap(type),options=Object.entries(map).map(([v,l])=>`<option value="${v}" ${value===v?'selected':''}>${l}</option>`).join('');return `<div class="field"><label>${label}</label><select data-key="${key}">${options}</select></div>`}if(type?.includes('textarea'))return `<div class="field full"><label>${label}${type.includes('required')?' *':''}</label><textarea data-key="${key}">${value}</textarea></div>`;return `<div class="field"><label>${label}${type==='required'?' *':''}</label><input data-key="${key}" value="${value.replaceAll('"','&quot;')}">${key==='last_verified'?'<button type="button" class="secondary" data-today> Aujourd’hui </button>':''}</div>`}
function renderFilters(){const vals=k=>[...new Set(activities.map(a=>text(a[k]).trim()).filter(Boolean))];$('department').innerHTML='<option value="">Tous les départements</option>'+vals('department').map(v=>`<option>${v}</option>`).join('');$('category').innerHTML='<option value="">Toutes les catégories</option>'+Object.entries(CATEGORIES).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');$('status').innerHTML='<option value="">Tous les statuts</option>'+Object.entries(STATUSES).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}
function renderList(){const q=$('search').value.toLowerCase(),d=$('department').value,c=$('category').value,s=$('status').value;$('list').innerHTML=activities.map((a,i)=>({a,i})).filter(({a})=>(!q||JSON.stringify(a).toLowerCase().includes(q))&&(!d||a.department===d)&&(!c||a.category===c)&&(!s||a.dog_status===s)).map(({a,i})=>`<div class="item ${i===selected?'active':''}" data-index="${i}"><b>${text(a.name)||'Sans nom'}</b><br><small>${human(STATUSES,a.dog_status)} · ${a.active===false?'Inactive':'Active'}</small></div>`).join('')||'<div class="empty">Aucune activité.</div>';document.querySelectorAll('[data-index]').forEach(x=>x.onclick=()=>{selected=Number(x.dataset.index);render()})}
function renderForm(){if(selected==null){$('form').innerHTML='<div class="empty">Sélectionnez une activité.</div>';return}const a=activities[selected];$('form').innerHTML=sections.map(([title,items])=>`<section class="section"><h2>${title}</h2><div class="grid">${items.map(field).join('')}</div>${title.startsWith('🌐')?'<p class="help">Pour une randonnée ou une activité décrite sur un site externe, indiquez ici le lien vers la fiche complète. Il n’est pas nécessaire de recopier tout l’itinéraire dans Breizh Plage.</p>':''}</section>`).join('')+'<section class="section"><label><input type="checkbox" data-key="active" '+(a.active!==false?'checked':'')+'> Activité active</label><div class="actions"><button type="button" id="save">Enregistrer</button><button type="button" id="duplicate" class="secondary">Dupliquer</button><button type="button" id="delete" class="danger">Supprimer</button></div></section>';document.querySelectorAll('[data-key]').forEach(x=>x.oninput=x.onchange=()=>{a[x.dataset.key]=x.type==='checkbox'?x.checked:x.value;saveDraft();renderList()});document.querySelectorAll('[data-today]').forEach(x=>x.onclick=()=>{a.last_verified=new Date().toISOString().slice(0,10);renderForm();saveDraft()});$('save').onclick=()=>{if(validate(a)){saveDraft();notice('Activité enregistrée dans le brouillon local.')}};$('duplicate').onclick=()=>duplicate();$('delete').onclick=()=>remove()}
function validate(a){for(const k of ['name','category','commune','department','description','dog_status'])if(!text(a[k]).trim()){notice(`Champ obligatoire manquant : ${k}`);return false}return true}function saveDraft(){localStorage.setItem(DRAFT,JSON.stringify({activities,version}))}function notice(v){$('notice').textContent=v}
function duplicate(){if(selected==null)return;const copy={...activities[selected],id:`${activities[selected].id||'activite'}-copie-${Date.now()}`,name:`${activities[selected].name||'Activité'} (copie)`};activities.push(copy);selected=activities.length-1;saveDraft();render();notice('Copie créée dans le brouillon local.')}
function remove(){if(selected==null)return;if(!confirm(`Supprimer ${activities[selected].name||activities[selected].id} ?`))return;activities.splice(selected,1);selected=null;saveDraft();render();notice('Activité retirée du prochain export.')}
function render(){renderFilters();renderList();renderForm()}
async function load(){try{if(location.protocol==='file:'){throw Error('Mode local')}const [d,v]=await Promise.all([fetch(DATA_URL,{cache:'no-store'}),fetch(VERSION_URL,{cache:'no-store'})]);if(!d.ok)throw Error('activites_chien.json indisponible');activities=normalize(await d.json());version=v.ok?await v.json():version;notice(`${activities.length} activité(s) chargée(s).`);render()}catch(e){const draft=JSON.parse(localStorage.getItem(DRAFT)||'null');if(draft){activities=draft.activities||[];version=draft.version||version;notice('Mode local : brouillon local restauré.');render()}else{activities=[];notice(location.protocol==='file:'?'Mode local : créez une activité ou importez un fichier JSON.':`Données indisponibles : ${e.message}`);render()}}}
$('newBtn').onclick=()=>{activities.push({id:`activite-${Date.now()}`,name:'',category:'autre',commune:'',department:'',description:'',dog_status:'a_verifier',leash_required:'inconnu',active:true});selected=activities.length-1;saveDraft();render()};$('search').oninput=renderList;['department','category','status'].forEach(id=>$(id).onchange=renderList);$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{try{activities=normalize(JSON.parse(await e.target.files[0].text()));selected=null;saveDraft();render();notice('Import JSON terminé.')}catch(err){notice(`Import impossible : ${err.message}`)}};$('exportBtn').onclick=()=>{if(activities.some(a=>!validate(a)))return;const next={activitiesVersion:Number(version.activitiesVersion||0)+1,updatedAt:new Date().toISOString()};const download=(n,c)=>{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([c],{type:'application/json'}));l.download=n;l.click();setTimeout(()=>URL.revokeObjectURL(l.href),100)};download('activites_chien.json',JSON.stringify({schema_version:1,activities},null,2));download('activites_chien_version.json',JSON.stringify(next,null,2));version=next;localStorage.removeItem(DRAFT);notice('Fichiers générés. Remplacez-les manuellement dans /data/.')};load();
</script></body></html>
