<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administration Breizh Plage</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  margin: 0;
  background: #eef7fb;
  color: #173042;
}

header {
  background: #0077b6;
  color: white;
  padding: 24px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 25px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

h2, h3 {
  color: #0077b6;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  border: 1px solid #cccccc;
  border-radius: 8px;
  margin-top: 5px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  background: #0096c7;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  cursor: pointer;
  margin-top: 15px;
  font-size: 16px;
}

button:hover {
  background: #0077b6;
}

button.secondary {
  background: #5b7080;
}

button.danger {
  background: #c0392b;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.list-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 8px;
}

.list-row input {
  margin-top: 0;
}

.list-row button {
  margin-top: 0;
  padding: 10px 13px;
}

#jsonResult {
  width: 100%;
  min-height: 420px;
  font-family: Consolas, monospace;
}

.notice {
  padding: 12px;
  border-radius: 8px;
  margin-top: 12px;
  display: none;
}

.notice.success {
  display: block;
  background: #dff6e7;
  color: #176b38;
}

.notice.error {
  display: block;
  background: #ffe2e2;
  color: #8d2020;
}

.preview {
  margin-top: 12px;
  max-width: 320px;
  border-radius: 12px;
  display: none;
}

@media (max-width: 700px) {
  .container {
    padding: 14px;
  }

  .actions {
    flex-direction: column;
  }

  button {
    width: 100%;
  }
}
</style>
</head>

<body>

<header>
  <h1>🌊 Administration Breizh Plage</h1>
  <p>Création des fiches du Guide du Littoral</p>
</header>

<div class="container">

  <div class="card">
    <h2>Nouvelle fiche</h2>

    <label>Type de fiche</label>
    <select id="category">
      <option value="meduses">🪼 Méduses</option>
      <option value="poissons">🐟 Poissons</option>
      <option value="crustaces">🦀 Crustacés</option>
      <option value="algues">🌿 Algues</option>
      <option value="coquillages">🐚 Coquillages</option>
      <option value="securite">⚠️ Sécurité</option>
    </select>

    <label>Titre</label>
    <input id="title" placeholder="Ex : Pélagie">

    <label>ID</label>
    <input id="id" placeholder="Généré automatiquement si laissé vide">

    <label>Nom scientifique</label>
    <input id="scientificName">

    <label>Niveau de danger</label>
    <select id="danger">
      <option value="faible">Faible</option>
      <option value="moyen">Moyen</option>
      <option value="fort">Fort</option>
      <option value="tres_fort">Très fort</option>
    </select>

    <label>Libellé du danger</label>
    <input id="dangerLabel" placeholder="Ex : Très urticante">

    <label>Résumé</label>
    <textarea id="summary"></textarea>

    <label>Présence en Bretagne</label>
    <textarea id="presence"></textarea>
  </div>

  <div class="card">
    <h2>Comment la reconnaître</h2>
    <div id="recognitionList"></div>
    <button type="button" onclick="addRow('recognitionList')">➕ Ajouter une ligne</button>
  </div>

  <div class="card">
    <h2>Les bons gestes</h2>
    <div id="goodActionsList"></div>
    <button type="button" onclick="addRow('goodActionsList')">➕ Ajouter une ligne</button>
  </div>

  <div class="card">
    <h2>À éviter</h2>
    <div id="avoidActionsList"></div>
    <button type="button" onclick="addRow('avoidActionsList')">➕ Ajouter une ligne</button>
  </div>

  <div class="card">
    <h2>Conseils et avertissement</h2>

    <label>Astuce d’Elouan</label>
    <textarea id="elouanTip"></textarea>

    <label>Avertissement</label>
    <textarea id="warning"></textarea>
  </div>

  <div class="card">
    <h2>Image</h2>

    <label>URL de l’image distante</label>
    <input id="imageUrl"
      placeholder="https://awenhafredrigstudio.bzh/images/guide/meduses/nom.jpg"
      oninput="updatePreview()">

    <label>Chemin de l’image locale</label>
    <input id="imageAsset"
      placeholder="assets/images/guide/meduses/nom.jpg">

    <img id="imagePreview" class="preview" alt="Aperçu">
  </div>

  <div class="card">
    <h2>Crédits photo</h2>

    <label>Crédit photo</label>
    <input id="photoCredit">

    <label>Auteur</label>
    <input id="photoAuthor">

    <label>Licence</label>
    <input id="photoLicense">

    <label>Nom de la source</label>
    <input id="photoSourceLabel">

    <label>URL de la source</label>
    <input id="photoSourceUrl">
  </div>

  <div class="card">
    <div class="actions">
      <button onclick="generer()">🧠 Générer la fiche</button>
      <button class="secondary" onclick="copierJson()">📋 Copier le JSON</button>
      <button class="secondary" onclick="telechargerJson()">💾 Télécharger la fiche</button>
      <button class="danger" onclick="viderFormulaire()">🗑️ Vider</button>
    </div>

    <div id="notice" class="notice"></div>
  </div>

  <div class="card">
    <h2>JSON généré</h2>
    <textarea id="jsonResult"></textarea>
  </div>

</div>

<script>
function addRow(containerId, value = "") {
  const container = document.getElementById(containerId);

  const row = document.createElement("div");
  row.className = "list-row";

  const input = document.createElement("input");
  input.type = "text";
  input.value = value;
  input.placeholder = "Écrire une information";

  const removeButton = document.createElement("button");
  removeButton.type = "button";
  removeButton.textContent = "✖";
  removeButton.className = "danger";
  removeButton.onclick = () => row.remove();

  row.appendChild(input);
  row.appendChild(removeButton);
  container.appendChild(row);
}

function getListValues(containerId) {
  return Array.from(
    document.querySelectorAll(`#${containerId} input`)
  )
  .map(input => input.value.trim())
  .filter(value => value !== "");
}

function slugify(value) {
  return value
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");
}

function cleanObject(object) {
  Object.keys(object).forEach(key => {
    const value = object[key];

    if (
      value === "" ||
      value === null ||
      value === undefined ||
      (Array.isArray(value) && value.length === 0)
    ) {
      delete object[key];
    }
  });

  return object;
}

function generer() {
  const title = document.getElementById("title").value.trim();

  if (!title) {
    showNotice("Le titre est obligatoire.", "error");
    return;
  }

  let id = document.getElementById("id").value.trim();

  if (!id) {
    id = slugify(title);
    document.getElementById("id").value = id;
  }

  const fiche = cleanObject({
    id: id,
    category: document.getElementById("category").value,
    title: title,
    scientific_name: document.getElementById("scientificName").value.trim(),
    image_url: document.getElementById("imageUrl").value.trim(),
    image_asset: document.getElementById("imageAsset").value.trim(),
    danger_level: document.getElementById("danger").value,
    danger_label: document.getElementById("dangerLabel").value.trim(),
    presence: document.getElementById("presence").value.trim(),
    summary: document.getElementById("summary").value.trim(),
    recognition: getListValues("recognitionList"),
    elouan_tip: document.getElementById("elouanTip").value.trim(),
    good_actions: getListValues("goodActionsList"),
    avoid_actions: getListValues("avoidActionsList"),
    warning: document.getElementById("warning").value.trim(),
    photo_author: document.getElementById("photoAuthor").value.trim() || null,
    photo_license: document.getElementById("photoLicense").value.trim() || null,
    photo_credit: document.getElementById("photoCredit").value.trim() || null,
    photo_source_label: document.getElementById("photoSourceLabel").value.trim() || null,
    photo_source_url: document.getElementById("photoSourceUrl").value.trim() || null
  });

  document.getElementById("jsonResult").value =
    JSON.stringify(fiche, null, 2);

  showNotice("La fiche a été générée.", "success");
}

async function copierJson() {
  const result = document.getElementById("jsonResult").value.trim();

  if (!result) {
    generer();
  }

  const value = document.getElementById("jsonResult").value.trim();

  if (!value) return;

  try {
    await navigator.clipboard.writeText(value);
    showNotice("JSON copié dans le presse-papiers.", "success");
  } catch (error) {
    showNotice("Impossible de copier automatiquement. Sélectionne le JSON manuellement.", "error");
  }
}

function telechargerJson() {
  if (!document.getElementById("jsonResult").value.trim()) {
    generer();
  }

  const result = document.getElementById("jsonResult").value.trim();

  if (!result) return;

  const id = document.getElementById("id").value.trim() || "nouvelle-fiche";
  const blob = new Blob([result], { type: "application/json;charset=utf-8" });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = `${id}.json`;
  link.click();

  URL.revokeObjectURL(url);
}

function updatePreview() {
  const image = document.getElementById("imagePreview");
  const url = document.getElementById("imageUrl").value.trim();

  if (!url) {
    image.style.display = "none";
    image.removeAttribute("src");
    return;
  }

  image.src = url;
  image.style.display = "block";

  image.onerror = () => {
    image.style.display = "none";
    showNotice("L’image distante ne peut pas être affichée.", "error");
  };
}

function viderFormulaire() {
  if (!confirm("Effacer tous les champs de la fiche ?")) {
    return;
  }

  document.querySelectorAll("input, textarea").forEach(element => {
    element.value = "";
  });

  document.getElementById("category").value = "meduses";
  document.getElementById("danger").value = "faible";

  document.getElementById("recognitionList").innerHTML = "";
  document.getElementById("goodActionsList").innerHTML = "";
  document.getElementById("avoidActionsList").innerHTML = "";

  addRow("recognitionList");
  addRow("goodActionsList");
  addRow("avoidActionsList");

  document.getElementById("imagePreview").style.display = "none";
  showNotice("Le formulaire a été vidé.", "success");
}

function showNotice(message, type) {
  const notice = document.getElementById("notice");
  notice.textContent = message;
  notice.className = `notice ${type}`;
}

addRow("recognitionList");
addRow("goodActionsList");
addRow("avoidActionsList");
</script>

</body>
</html>
