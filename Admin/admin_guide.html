<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administration Breizh Plage</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    margin:0;
    background:#eef7fb;
}

header{
    background:#0077b6;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

h2{
    color:#0077b6;
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,
textarea,
select{

    width:100%;
    padding:12px;
    border:1px solid #cccccc;
    border-radius:8px;
    margin-top:5px;
}

textarea{
    min-height:90px;
}

button{

    background:#0096c7;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px 18px;
    cursor:pointer;
    margin-top:15px;
    font-size:16px;
}

button:hover{

    background:#0077b6;
}

#jsonResult{

    width:100%;
    min-height:300px;
    font-family:Consolas,monospace;
}

</style>

</head>

<body>

<header>

<h1>🌊 Administration Breizh Plage</h1>
<p>Création des fiches du Guide du Littoral</p>

</header>

<div class="container">

<div class="card">

<h2>Nouvelle fiche</h2>

<label>Titre</label>
<input id="title">

<label>Nom scientifique</label>
<input id="scientificName">

<label>Niveau de danger</label>

<select id="danger">

<option>Faible</option>
<option>Moyen</option>
<option>Elevé</option>
<option>Très élevé</option>

</select>

<label>Résumé</label>

<textarea id="summary"></textarea>

<label>Présence en Bretagne</label>

<textarea id="presence"></textarea>

<button onclick="generer()">Générer le JSON</button>

</div>

<div class="card">

<h2>JSON généré</h2>

<textarea id="jsonResult"></textarea>

</div>

</div>

<script>

function generer(){

let fiche={

title:document.getElementById("title").value,

scientific_name:document.getElementById("scientificName").value,

danger_level:document.getElementById("danger").value,

summary:document.getElementById("summary").value,

presence:document.getElementById("presence").value

};

document.getElementById("jsonResult").value=
JSON.stringify(fiche,null,2);

}

</script>

</body>

</html>
